<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero Variations</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; font: 600 14px/1 system-ui, sans-serif; }
  .bar { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 2; display: flex; gap: 4px; padding: 5px; background: #111; border-radius: 999px; box-shadow: 0 6px 24px rgba(0,0,0,.35); }
  .bar button { border: 0; padding: 10px 16px; border-radius: 999px; background: transparent; color: #ddd; font: inherit; cursor: pointer; white-space: nowrap; }
  .bar button[aria-pressed="true"] { background: #fff; color: #111; }
  iframe { display: block; width: 100%; height: 100%; border: 0; background: #fff; }
</style>
</head>
<body>
<div class="bar" role="group" aria-label="Hero">
  <button data-v="now" aria-pressed="true">Current</button>
  <button data-v="booth">1 · Photo booth</button>
  <button data-v="popout">2 · Pop-out</button>
  <button data-v="stickers">3 · Stickers</button>
</div>
<iframe id="f" src="/"></iframe>

<template id="booth">
<style>
  .hero-booth { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 56px; align-items: center; padding: 72px 0 48px; }
  .hero-booth h1 { font-size: clamp(48px, 8vw, 104px); line-height: .9; letter-spacing: -.045em; margin: 0; }
  .hero-booth .tag { font-size: 20px; margin-top: 14px; }
  .hero-booth .bio { max-width: 600px; }
  .strip { width: 210px; padding: 12px 12px 0; background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.08), 0 18px 40px rgba(0,0,0,.18); transform: rotate(4deg); transition: transform .25s ease; }
  .strip:hover { transform: rotate(0) scale(1.03); }
  .strip img { width: 100%; aspect-ratio: 1; object-fit: cover; margin-bottom: 10px; filter: contrast(1.05) saturate(1.1); }
  .strip p { margin: 0; padding: 4px 0 12px; text-align: center; font: 700 13px/1 "Source Sans 3", sans-serif; letter-spacing: .25em; color: #222; }
  @media (max-width: 760px) { .hero-booth { grid-template-columns: 1fr; gap: 32px; } .strip { width: auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 8px; transform: rotate(-2deg); } .strip img { margin: 0; } .strip p { display: none; } }
</style>
<header class="wrap hero-booth">
  <div>
    <h1>Andrew<br>Kamphey</h1>
    <p class="tag">Creator / Coder</p>
    <p class="bio">I grew up in the Florida tropics, spent years on cruise ships and in LA television, then fell for Google Sheets and never left. Since 2020 I've run <strong>Better Sheets</strong>. These days I build a lot of things at once.</p>
    <nav class="links" aria-label="Elsewhere"><a href="https://x.com/Kamphey">X / Twitter</a> <a href="https://www.youtube.com/bettersheets">YouTube</a> <a href="https://www.linkedin.com/in/andrewkamphey">LinkedIn</a></nav>
  </div>
  <div class="strip" aria-hidden="true">
    <img src="/img/me/face-4.jpg" alt=""><img src="/img/me/face-6.jpg" alt=""><img src="/img/me/face-2.jpg" alt=""><img src="/img/me/face-5.jpg" alt="">
    <p>KAMPHEY · 2026</p>
  </div>
</header>
</template>

<template id="popout">
<style>
  .hero-pop { position: relative; padding: 64px 0 40px; text-align: center; }
  .hero-pop .first { font-size: clamp(22px, 3vw, 34px); font-weight: 700; margin: 0; }
  .hero-pop .giant { position: relative; height: clamp(220px, 34vw, 440px); margin-top: 4px; }
  .hero-pop .giant h1 { position: absolute; inset: 0 0 auto; font-size: clamp(76px, 17vw, 236px); line-height: .85; letter-spacing: -.06em; margin: 0; color: var(--link); }
  .hero-pop .giant button { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); width: clamp(240px, 38vw, 500px); padding: 0; border: 0; background: none; cursor: pointer; }
  .hero-pop .giant img { width: 100%; display: block; filter: drop-shadow(0 18px 24px rgba(0,0,0,.25)); transition: transform .2s ease; }
  .hero-pop .giant button:hover img { transform: translateY(-6px) rotate(-2deg); }
  .hero-pop .hint { position: absolute; right: 6%; top: 46%; font-size: 15px; font-weight: 700; color: var(--muted); transform: rotate(8deg); }
  .hero-pop .bio { margin: 28px auto 0; max-width: 680px; }
  .hero-pop .links { justify-content: center; }
  @media (max-width: 560px) { .hero-pop .hint { display: none; } }
</style>
<header class="wrap hero-pop">
  <p class="first">Andrew</p>
  <div class="giant">
    <h1>KAMPHEY</h1>
    <button type="button" aria-label="Show another photo" onclick="const p=['4','6','2','5','7','1','3'];this.dataset.i=((+this.dataset.i||0)+1)%p.length;this.querySelector('img').src='/img/me/cut-'+p[this.dataset.i]+'.png'"><img src="/img/me/cut-4.png" alt="Andrew Kamphey"></button>
    <span class="hint">click me ↺</span>
  </div>
  <p class="bio">Creator / Coder. I grew up in the Florida tropics, spent years on cruise ships and in LA television, then fell for Google Sheets and never left. Since 2020 I've run <strong>Better Sheets</strong>.</p>
  <nav class="links" aria-label="Elsewhere"><a href="https://x.com/Kamphey">X / Twitter</a> <a href="https://www.youtube.com/bettersheets">YouTube</a> <a href="https://www.linkedin.com/in/andrewkamphey">LinkedIn</a></nav>
</header>
</template>

<template id="stickers">
<style>
  .hero-stk { position: relative; padding: 96px 0 64px; min-height: 560px; }
  .hero-stk .hi { font-size: 20px; color: var(--muted); margin: 0; }
  .hero-stk h1 { position: relative; z-index: 2; max-width: 760px; font-size: clamp(36px, 5.4vw, 70px); line-height: 1.05; letter-spacing: -.03em; margin: 8px 0 0; }
  .hero-stk h1 a { color: inherit; text-decoration: none; background: linear-gradient(var(--hl), var(--hl)) 0 88% / 100% .3em no-repeat; }
  .hero-stk h1 a:nth-of-type(1) { --hl: #ffd84d90; } .hero-stk h1 a:nth-of-type(2) { --hl: #4caf5070; } .hero-stk h1 a:nth-of-type(3) { --hl: #2f6bff60; } .hero-stk h1 a:nth-of-type(4) { --hl: #ff7a2f70; }
  .hero-stk .bio { position: relative; z-index: 2; max-width: 560px; }
  .hero-stk .links { position: relative; z-index: 2; }
  .stk { position: absolute; z-index: 1; width: var(--w); transform: rotate(var(--r)); filter: drop-shadow(3px 0 0 #fff) drop-shadow(-3px 0 0 #fff) drop-shadow(0 3px 0 #fff) drop-shadow(0 -3px 0 #fff) drop-shadow(0 8px 12px rgba(0,0,0,.22)); transition: transform .2s ease; }
  .stk:hover { transform: rotate(0) scale(1.08); z-index: 3; }
  .stk.s1 { --w: 230px; --r: 8deg; right: 0; top: 40px; }
  .stk.s2 { --w: 190px; --r: -10deg; right: 220px; top: 250px; }
  .stk.s3 { --w: 170px; --r: 12deg; right: 10px; top: 330px; }
  .stk.s4 { --w: 150px; --r: -6deg; right: 260px; top: 40px; }
  @media (max-width: 980px) { .stk.s2, .stk.s4 { display: none; } .stk.s1 { --w: 170px; } .stk.s3 { --w: 130px; top: 260px; } .hero-stk h1 { max-width: 70%; } }
  @media (max-width: 600px) { .hero-stk { min-height: 0; padding-top: 220px; } .stk.s1 { --w: 150px; top: 70px; right: auto; left: 0; } .stk.s3 { --w: 120px; top: 80px; right: 0; } .hero-stk h1 { max-width: none; } }
  @media (prefers-reduced-motion: reduce) { .stk { transition: none; } }
</style>
<header class="wrap hero-stk">
  <img class="stk s1" src="/img/me/cut-4.png" alt="">
  <img class="stk s2" src="/img/me/cut-2.png" alt="">
  <img class="stk s3" src="/img/me/cut-6.png" alt="">
  <img class="stk s4" src="/img/me/cut-7.png" alt="">
  <p class="hi">Hi, I'm Andrew Kamphey.</p>
  <h1>I make <a href="https://bettersheets.co">software</a>, <a href="https://bigbeanbattle.com">games</a>, <a href="https://wheresmymouse.com">apps</a> and <a href="https://balimicro.com">stuff you can hold</a>.</h1>
  <p class="bio">I grew up in the Florida tropics, spent years on cruise ships and in LA television, then fell for Google Sheets and never left. Since 2020 I've run <strong>Better Sheets</strong>.</p>
  <nav class="links" aria-label="Elsewhere"><a href="https://x.com/Kamphey">X / Twitter</a> <a href="https://www.youtube.com/bettersheets">YouTube</a> <a href="https://www.linkedin.com/in/andrewkamphey">LinkedIn</a></nav>
</header>
</template>

<script>
const f = document.getElementById("f");
let original = null, current = "now";
function apply() {
  const d = f.contentDocument; if (!d) return;
  const header = d.querySelector("header");
  if (!original) original = header.outerHTML;
  d.querySelectorAll("style.hero-v").forEach(s => s.remove());
  if (current === "now") { header.outerHTML = original; return; }
  const t = document.getElementById(current).content.cloneNode(true);
  const style = t.querySelector("style"); style.classList.add("hero-v"); d.head.appendChild(style);
  const h = t.querySelector("header");
  header.replaceWith(d.importNode(h, true));
  const track = d.querySelector(".reel .track");
  if (track) {
    const cards = [...d.querySelectorAll(".card")];
    const items = cards.map((c, i) => `<a href="${c.href}" style="--r:${[-3, 2, -1, 3, -2, 1, -3, 2][i % 8]}deg"><img src="${c.querySelector("img").getAttribute("src")}" alt="${c.querySelector("h3").textContent}"></a>`).join("");
    track.innerHTML = items + items;
  }
}
f.addEventListener("load", () => { original = null; apply(); });
document.querySelectorAll(".bar button").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll(".bar button").forEach(x => x.setAttribute("aria-pressed", x === b));
  current = b.dataset.v; apply();
}));
</script>
</body>
</html>
